[platformio]
default_envs = BOARD_VIEWE_UEDX80480050E_WB_A

;
; 全局配置
;
[env]
framework = arduino
; The `espressif32` latest official version does not support Arduino v3.1.x, temporarily using a third-party version
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
monitor_speed = 115200
; CH340 在 921600 下容易中途失联（The chip stopped responding），降到 460800 稳定得多
upload_speed = 115200
; Arduino 默认 -Os（体积优先），这里改成性能优先，界面渲染更顺
build_unflags = -Os
; 7MB app 分区（智能家居 UI + 图片资源约 2MB，留足余量）
board_build.partitions = partitions_16MB_smart_home.csv
; 依赖全部放在 lib/ 里（离线可编译，见 README）
; lib/ESP32_Display_Panel、ESP32_IO_Expander、esp-lib-utils、lvgl(9.5.0)、ArduinoJson

;
; 通用编译选项
;
[common]
build_flags =
; Performance first:
    -O2
; Arduino related:
    -DCORE_DEBUG_LEVEL=1
; LVGL related:
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
; lib/lvgl 用的是乐鑫组件仓库那份 LVGL（头里带 Kconfig 钩子），忽略它、只认 src/lv_conf.h
    -DLV_KCONFIG_IGNORE=1
; Include paths:
    -I src
    -I src/ui
    -I src/app

[spi_qspi_lcd]
build_flags =
; LVGL v9 没有 LV_COLOR_16_SWAP，字节序由 lv_display_set_color_format() 表达
    -DLV_COLOR_16_SWAP=1

[rgb_mipi_lcd]
build_flags =
    -DLV_COLOR_16_SWAP=0

;
; 板级环境
;
[env:BOARD_VIEWE_UEDX80480050E_WB_A]
build_flags =
    ${common.build_flags}
    ${rgb_mipi_lcd.build_flags}
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX80480050E_WB_A
board = BOARD_VIEWE_UEDX80480050E_WB_A

[env:BOARD_VIEWE_UEDX80480070E_WB_A]
build_flags =
    ${common.build_flags}
    ${rgb_mipi_lcd.build_flags}
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX80480070E_WB_A
board = BOARD_VIEWE_UEDX80480070E_WB_A
